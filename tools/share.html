<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domination score — a sketch</title>

<!--
  A DUMMY TOOL. Not linked from the site and not styled like it beyond the
  palette; it exists to answer one question before anything is built for real:

    what does "how much of a season did somebody win" actually look like?

  Answered as a **domination score out of 100**. 100 is the whole season: every
  title on the board, nobody else got one. Two readings of it:

    titles     titles won / titles there were
    weighted   the same, with every title worth phi^(rungs above Super 750)

  It is a percentage underneath and deliberately not called one. "75% of 2022"
  invites the question "per cent of what?" every time it is read; a score out of
  100 carries its own scale, and the count it is made of is on the hover.

  The weights come from the *same ladder the photographs are sized with*
  (`honourRung` in model.js), so a Super 1000 is worth phi times a Super 750,
  and the Olympics phi^4 of one — 6.85 Super 750s. The pyramid sizes a square by
  area and area is what goes up by phi a rung, so that is the default; the
  square-root basis, which is what the *side* of a square does, is offered
  beside it because it is the other defensible reading.

  Nothing here is imported by the app. It imports FROM the app — `model.js` for
  the ladder and for `winnersSeasons`, which is what moves a season-ending
  Finals back into the season it concludes — so the numbers cannot drift from
  the board they are meant to describe.

  ⚠️ There was a Super 500 toggle here and it is gone. `harvest-winners.mjs
  --tier 25` still collects those winners if anybody wants to try again, but the
  answer was no on both sides: **nothing lands on Super 500 before 2018** — four
  old tiers became five and that is the one nothing maps to — so it left
  2007–17 untouched at 13–15 titles a season while taking 2023–25 from 12 to 21,
  and every early season was then scored against a smaller field than every late
  one. After 2018 it changed the ranking of the top seasons hardly at all, so it
  cost comparability and bought nothing.

  Run it:  node serve.mjs   then open  http://localhost:8090/tools/share.html
  (It fetches ../data/*.json, so file:// will not work.)
-->

<style>
  :root {
    color-scheme: dark;
    --font: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "Roboto Mono", ui-monospace, Consolas, monospace;
    --bg: #1a1a1a; --surface: #262626; --surface-2: #2f2f2f; --surface-sunk: #212121;
    --text: #f2f2f2; --text-dim: #c9c9c9; --text-muted: #9a9a9a;
    --border: #3d3d3d; --border-soft: #303030;
    --accent: #df2027; --accent-fg: #fff; --accent-text: #ff5f64;
    --warn: #ffbc20;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px 22px 60px;
    background: var(--bg); color: var(--text);
    font: 400 13px/1.45 var(--font);
  }
  h1 { font-size: 17px; margin: 0 0 2px; }
  h1 small { font: 400 12px var(--font); color: var(--text-muted); margin-left: 8px; }
  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
       color: var(--text-muted); margin: 22px 0 8px; font-weight: 600; }

  .bar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin: 14px 0 4px; }
  .lbl { font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase;
         color: var(--text-muted); }
  .seg { display: flex; gap: 3px; }
  button.opt {
    font: 400 11.5px var(--font); padding: 3px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface-sunk); color: var(--text-muted);
    transition: background .12s, color .12s, border-color .12s;
  }
  button.opt:hover { border-color: var(--text-muted); color: var(--text-dim); }
  button.opt.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.opt:disabled { opacity: .4; cursor: not-allowed; }
  input[type=range] { accent-color: var(--accent); width: 150px; vertical-align: middle; }

  .note { color: var(--text-muted); font-size: 12px; max-width: 96ch; margin: 8px 0 0; }
  .note b { color: var(--text-dim); }
  .warnline { color: var(--warn); }

  .chartwrap { position: relative; margin-top: 10px; }
  svg { display: block; width: 100%; height: auto; background: var(--surface-sunk);
        border: 1px solid var(--border-soft); border-radius: 6px; }
  .grid line { stroke: rgba(255,255,255,.07); }
  .axis text { fill: var(--text-muted); font: 400 10px var(--mono); }
  .lane { fill: rgba(255,255,255,.028); }
  /* The footnote mark, and everything wearing it. Amber, and the same ⁕ the
     pyramid puts beside a displaced year — one mark to learn, not two. */
  .axis .ast { fill: var(--warn); font-size: 13px; }
  .strip .sz { fill: rgba(255,255,255,.14); }
  .strip .sz.is-thin { fill: var(--warn); opacity: .75; }
  .strip .szn { fill: var(--text-muted); font: 400 9.5px var(--mono); }
  .strip .szn.is-thin { fill: var(--warn); }
  .strip .szlbl { fill: var(--text-muted); font: 400 9px var(--mono); }
  path.series.over-hole { stroke-dasharray: 4 4; }
  .strip .sz.is-thin { fill: var(--warn); opacity: .75; }
  .hole { fill: rgba(255,188,32,.07); }
  .why { fill: var(--warn); font: 400 10px var(--mono); opacity: .85; }
  .pt .ring { stroke-width: 2; }
  .pt.on-hole .ring { stroke-width: 2.5; }
  .pt.on-hole { filter: drop-shadow(0 0 3px rgba(255,188,32,.9)); }
  path.series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .pt image { pointer-events: none; }
  .dim { opacity: .13; }
  .hit { fill: transparent; cursor: pointer; }

  #tip {
    position: absolute; pointer-events: none; z-index: 5; min-width: 190px; max-width: 300px;
    background: #101010ee; border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 22px #0009;
  }
  #tip[hidden] { display: none; }
  #tip .who { display: flex; align-items: center; gap: 7px; font-weight: 700; margin-bottom: 4px; }
  #tip img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
  #tip .big { font: 700 16px var(--mono); }
  #tip ul { margin: 5px 0 0; padding-left: 15px; color: var(--text-dim); }
  #tip li { font-size: 11.5px; }
  #tip .k { color: var(--text-muted); }

  .legend { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .lg {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface-sunk);
    border-radius: 999px; padding: 2px 10px 2px 3px; font-size: 11.5px; color: var(--text-dim);
  }
  .lg img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
  .lg i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .lg.off { opacity: .35; }
  .lg .pk { font: 400 10px var(--mono); color: var(--text-muted); }

  table { border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  th, td { padding: 3px 12px 3px 0; text-align: left; white-space: nowrap; }
  th { color: var(--text-muted); font-weight: 600; font-size: 10.5px;
       letter-spacing: .06em; text-transform: uppercase; }
  td.n { font-family: var(--mono); }
  /* ⚠️ **Dimmed, not coloured.** These rows were amber, which is the palette's
     attention colour — so the one season nobody should read at face value was
     the brightest line in the table, and Anders ANTONSEN's two titles out of
     three looked like the find of the chart. A footnote should recede. The
     asterisk stays lit, because a mark is a pointer and not a highlight. */
  tr.thin td { color: var(--text-muted); }
  tr.thin td.n { color: #7a7a7a; }
  .ast { font-style: normal; color: var(--warn); margin-left: 2px; }
  .cols { display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-start; }
  code { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); }
</style>

<body>

<h1>Domination score <small>a sketch, not a page</small></h1>
<p class="note" id="sub">Loading…</p>

<div class="bar">
  <span class="lbl">Draw</span>
  <span class="seg" id="kindSeg"></span>
  <span class="lbl" style="margin-left:14px">Metric</span>
  <span class="seg" id="metricSeg"></span>
  <span class="lbl" style="margin-left:14px" id="basisLbl">Ladder</span>
  <span class="seg" id="basisSeg"></span>
</div>
<div class="bar">
  <span class="lbl">Show</span>
  <input type="range" id="floor" min="0" max="60" step="5" value="20">
  <span id="floorTxt" class="lbl" style="text-transform:none;letter-spacing:0"></span>
</div>

<div class="chartwrap">
  <svg id="chart" viewBox="0 0 1180 510" preserveAspectRatio="xMidYMid meet"></svg>
  <div id="tip" hidden></div>
</div>
<div class="legend" id="legend"></div>

<p class="note" id="weightNote"></p>

<div class="cols">
  <div>
    <h2>Best single seasons</h2>
    <table id="best"></table>
  </div>
  <div>
    <h2>What each season held</h2>
    <table id="years"></table>
  </div>
</div>

<script type="module">
import { winnersSeasons, honourRung, PHI } from '../model.js';

/* The era band's idea — one colour per career, handed out in the order careers
 * open, so a repeat only happens with many years between — with two changes the
 * bands do not need.
 *
 * ⚠️ **Adjacent entries have to be unconfusable**, because the players who open
 * in neighbouring seasons are the ones drawn on top of each other here.
 * `REIGN_COLOURS` holds `#4f9dff` and `#a3a3ff`, two blues, which is fine for
 * bars lying in different parts of the page and not fine on a line chart: it put
 * Viktor AXELSEN and KIDAMBI Srikanth in near-identical blue a season apart. The
 * order below walks the colour wheel rather than the band's palette.
 *
 * ⚠️ And twelve rather than eight, because a chart shows a dozen careers at once
 * where a band shows one per lane. Kept here and not in `poster.js`: the extra
 * hues are only right for this. */
const PALETTE = [
  '#4f9dff', // blue
  '#f2994a', // orange
  '#57c98a', // green
  '#ff6b8b', // pink
  '#f6d34a', // yellow
  '#c77dff', // purple
  '#12b5a5', // teal
  '#e8734a', // rust
  '#8ad35b', // lime
  '#ff9ad5', // rose
  '#d4b483', // sand
  '#7fd4d0', // ice
];

/* ---------- the ladder ---------- */

/* Super 750 is 1. Everything else is measured against it, because it is the
   bottom of the board — the lowest tier the whole top of the game enters. */
const BASE_RUNG = honourRung(24);

/* ⚠️ Two defensible readings of "golden ratio weighting", and they are not the
   same number. The photographs step by sqrt(phi) on the *side*, which makes the
   *area* step by phi. Area is what the eye actually compares on the pyramid, so
   phi-per-rung is the default and sqrt(phi)-per-rung is offered beside it. */
const BASIS = {
  area: {
    label: 'Steep', step: PHI,
    /* ⚠️ Named by what it *does*, not by the constant behind it. The buttons
       said "φ per rung" and "√φ per rung", which is precise and unreadable: a
       reader who does not already know what φ is cannot guess which button is
       the bigger one, and a reader who does know still has to work out whether
       a rung is a tier. The provenance is in the sentence underneath. */
    why: 'a title is worth <b>1.6×</b> the tier below it, so an Olympic gold is '
      + 'nearly seven Super 750s. The step a square’s <i>area</i> takes on the '
      + 'pyramid',
  },
  side: {
    label: 'Gentle', step: Math.sqrt(PHI),
    why: 'a title is worth <b>1.27×</b> the tier below it, so an Olympic gold is '
      + 'about two and a half Super 750s. The step a square’s <i>side</i> takes',
  },
};

const weightOf = (tier, basis) =>
  Math.pow(BASIS[basis].step, BASE_RUNG - honourRung(tier));

const TIER_NAME = { OLY: 'Olympics', 20: 'World Champs', 22: 'Tour Finals',
  23: 'Super 1000', 24: 'Super 750', 25: 'Super 500' };

/* ---------- state ---------- */

const view = { kind: 'MS', metric: 'share', basis: 'area', floor: 20, autoFloor: true };
const files = {};
const only = new Set();     // legend pins; empty means "everybody who clears the floor"

const $ = id => document.getElementById(id);
/* Out of 100, and never printed with a % sign — see the note at the top. */
const score = x => (x * 100).toFixed(x >= 0.995 ? 0 : 1).replace(/\.0$/, '');

/* ---------- loading ---------- */

async function grab(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ' → ' + r.status);
  return r.json();
}

async function load(kind) {
  if (!files[kind]) files[kind] = await grab(`../data/winners-${kind}.json`);
  return files[kind];
}

/* ---------- the numbers ---------- */

/**
 * Every player's season-by-season share of what was on offer.
 *
 * ⚠️ A player has a point only in the years they won something. There is no
 * third column in this data saying who *entered*, so "0% in 2013" and "not on
 * the tour in 2013" cannot be told apart — and a line drawn along zero would be
 * claiming the first when it only knows the second. Runs break at any gap, so
 * two dots four years apart stay two dots.
 */
function build() {
  const file = files[view.kind];
  const { years, byYear } = winnersSeasons(file);
  const basis = view.basis;

  const seasons = years.map(year => {
    const list = byYear.get(year) || [];
    const total = list.length;
    const mass = list.reduce((n, t) => n + weightOf(t.tier, basis), 0);
    const by = new Map();
    for (const t of list) {
      const cur = by.get(t.w) || { n: 0, w: 0, titles: [] };
      cur.n += 1;
      cur.w += weightOf(t.tier, basis);
      cur.titles.push(t);
      by.set(t.w, cur);
    }
    return { year, total, mass, by, tiers: list };
  });

  const people = new Map();
  for (const s of seasons) {
    for (const [id, got] of s.by) {
      if (!people.has(id)) people.set(id, { id, who: file.players[id] || { n: '#' + id }, pts: [] });
      people.get(id).pts.push({
        year: s.year,
        share: s.total ? got.n / s.total : 0,
        weighted: s.mass ? got.w / s.mass : 0,
        n: got.n, of: s.total, titles: got.titles,
      });
    }
  }

  const list = [...people.values()];
  for (const p of list) p.peak = Math.max(...p.pts.map(pt => pt[view.metric]));

  /* Ordered the way the era bands order their lanes — by the season a career
     opens — so the two views tell the same story in the same sequence. The
     colours themselves are handed out later, over the players actually drawn:
     see `paint`. */
  list.sort((a, b) => (a.pts[0].year - b.pts[0].year) || (a.id - b.id));
  return { years, seasons, people: list };
}

/* ---------- the chart ---------- */

/* `b` leaves room under the plot for the year labels *and* the strip that says
   how big each season was — see `thinYears`. */
const PAD = { l: 46, r: 16, t: 14, b: 74 };
const W = 1180, H = 510;
const STRIP = { top: H - 44, h: 32 };
/* Big enough to be a face rather than a smudge, small enough that a crowded
   stretch of the chart is still a set of separate marks. */
const FACE = 9;

/* ⚠️ **A season with a hole in it, relative to the seasons around it.** Not a
   fixed count: the calendar has been 15 titles in a season and 8, so "fewer
   than six" means different things in different decades. Two thirds of the
   median is the line, which catches 2020
   (three titles played), 2022 (eight, the Asian swing still cancelled) and the
   season currently being played. */
/* Why a season was short, where it is a fact rather than an inference. Drawn
   inside the plot against that year, because "2020 was a hole" is a thing the
   reader either already knows or wants told at the point of confusion. */
const WHY_SHORT = {
  2020: 'Covid', 2021: 'Covid', 2022: 'Covid',
  [new Date().getUTCFullYear()]: 'ongoing',
};

function thinYears(seasons) {
  const sizes = seasons.map(s => s.total).filter(n => n > 0).sort((a, b) => a - b);
  if (!sizes.length) return { set: new Set(), median: 0, max: 0 };
  const median = sizes[Math.floor(sizes.length / 2)];
  return {
    median, max: sizes[sizes.length - 1],
    set: new Set(seasons.filter(s => s.total > 0 && s.total < median * 0.66).map(s => s.year)),
  };
}

/**
 * Hand the palette out to the careers on screen, in the order they opened.
 *
 * ⚠️ Over the **shown** players and not all forty-four. The era bands can afford
 * to colour every career from a fixed cycle because two bars of one colour are
 * far apart on the page; a line chart draws them through each other, and at one
 * colour per career LEE Chong Wei, SHI Yu Qi and KIDAMBI Srikanth all came out
 * green. Colouring what is drawn means the set on screen is always distinct.
 *
 * The cost is that a ring changes colour when the filter moves, and it is a cost
 * worth paying now that the marker is a photograph: the face says who it is and
 * the ring only has to make the line followable.
 */
function paint(shown) {
  shown.forEach((p, i) => { p.colour = PALETTE[i % PALETTE.length]; });
  return shown;
}

function draw(model) {
  const { years, seasons, people } = model;
  const svg = $('chart');
  const floor = view.floor / 100;
  const shown = paint(people.filter(p => p.peak >= floor && (!only.size || only.has(p.id))));

  const top = Math.min(1, Math.max(0.25,
    Math.ceil(Math.max(0.01, ...shown.map(p => p.peak)) * 10) / 10));
  const x = i => PAD.l + (W - PAD.l - PAD.r) * (years.length < 2 ? 0.5 : i / (years.length - 1));
  const y = v => H - PAD.b - (H - PAD.t - PAD.b) * (v / top);
  const at = year => x(years.indexOf(year));

  const out = [`<defs><clipPath id="face"><circle r="${FACE}"></circle></clipPath></defs>`];

  const thin = thinYears(seasons);

  /* A faint column inside the plot for a season with a hole in it, named at the
     foot of it. The strip under the axis says *how* short; this says *why*, and
     puts it where the line does something strange rather than in a caption. */
  const colHalf = (W - PAD.l - PAD.r) / Math.max(1, years.length - 1) / 2;
  for (const yr of thin.set) {
    const i = years.indexOf(yr);
    if (i < 0) continue;
    out.push(`<rect class="hole" x="${x(i) - colHalf * 0.75}" y="${PAD.t}"`
      + ` width="${colHalf * 1.5}" height="${H - PAD.t - PAD.b}"></rect>`);
    if (WHY_SHORT[yr]) {
      /* The season in progress is the last column, and a centred label there
         runs off the plot. Anchored to whichever edge it is against. */
      const last = i === years.length - 1;
      out.push(`<text class="why" x="${last ? W - PAD.r - 4 : x(i)}"`
        + ` y="${H - PAD.b - 7}" text-anchor="${last ? 'end' : 'middle'}">`
        + `${WHY_SHORT[yr]}</text>`);
    }
  }

  out.push('<g class="grid">');
  const step = top > 0.6 ? 0.2 : top > 0.3 ? 0.1 : 0.05;
  for (let v = 0; v <= top + 1e-9; v += step) {
    out.push(`<line x1="${PAD.l}" x2="${W - PAD.r}" y1="${y(v)}" y2="${y(v)}"></line>`);
  }
  out.push('</g><g class="axis">');
  for (let v = 0; v <= top + 1e-9; v += step) {
    out.push(`<text x="${PAD.l - 8}" y="${y(v) + 3.5}" text-anchor="end">${Math.round(v * 100)}</text>`);
  }
  years.forEach((yr, i) => {
    /* Every other year when the axis is crowded — except a year carrying the
       footnote, which must keep its label or the mark has nothing to sit on.
       2020 and 2022 both fell on the skipped alternate and the asterisk simply
       was not drawn. */
    const keep = i === years.length - 1 || thin.set.has(yr);
    if (years.length > 14 && i % 2 && !keep) return;
    /* A mark on the year and a line underneath saying what it is — the same
       grammar the pyramid uses for a displaced title, so a reader who has learned
       one footnote on this project has learned this one.

       ⚠️ A plain **asterisk**, and not the pyramid's ⁕ (U+2055): that glyph has no
       form in Roboto or in any of the fallbacks, so it renders as a small dot —
       which is what it does on the Winners page too, where the note calls it an
       asterisk and the page draws a dot. If this ever ships, the two should agree
       on a character that actually exists. */
    const mark = thin.set.has(yr) ? '<tspan class="ast">*</tspan>' : '';
    out.push(`<text x="${x(i)}" y="${H - PAD.b + 15}" text-anchor="middle">${yr}${mark}</text>`);
  });
  out.push('</g>');

  /* ---- how much there was to win ----

     ⚠️ The denominator, drawn. A score is a fraction and the numerator is the
     only half the line shows; without this, 66.7 in 2020 and 66.7 in 2015 are
     the same height on the page and one of them is two matches. Kept out of the
     plot and under the axis, because it is a different quantity — behind the
     lines it read as a second series. */
  out.push('<g class="strip">');
  const half = (W - PAD.l - PAD.r) / Math.max(1, years.length - 1) / 2;
  /* Narrow, so a bar reads as a bar. At the width of its own height the tall
     ones came out as squares and the strip stopped looking like a quantity. */
  const bw = Math.max(3, Math.min(11, half * 0.7));
  years.forEach((yr, i) => {
    const s = seasons[i];
    const h = thin.max ? (STRIP.h * s.total) / thin.max : 0;
    out.push(`<rect class="sz${thin.set.has(yr) ? ' is-thin' : ''}"`
      + ` x="${x(i) - bw / 2}" y="${STRIP.top + STRIP.h - h}"`
      + ` width="${bw}" height="${Math.max(h, s.total ? 1 : 0)}"></rect>`);
    /* On every bar, not only the short ones. The number was the short seasons'
       badge, which made a count look like a warning; it is just the size of the
       season, and a reader comparing 2022 to 2023 wants both of them. */
    out.push(`<text class="szn${thin.set.has(yr) ? ' is-thin' : ''}" x="${x(i)}"`
      + ` y="${STRIP.top + STRIP.h - h - 4}" text-anchor="middle">${s.total}</text>`);
  });
  out.push(`<text class="szlbl" x="${PAD.l - 8}" y="${STRIP.top + STRIP.h}"`
    + ` text-anchor="end">titles</text>`);
  out.push('</g>');

  /* Lines first, then every marker on top of every line, so a dot is never
     buried under somebody else's segment. */
  for (const p of shown) {
    const runs = [];
    for (const pt of p.pts) {
      const last = runs[runs.length - 1];
      if (last && pt.year === last[last.length - 1].year + 1) last.push(pt);
      else runs.push([pt]);
    }
    /* ⚠️ Segment by segment rather than one polyline per run, so a leg that
       touches a short season can be **dashed**: a solid line across 2020 asserts
       a trend through a year that was barely played. Straight legs, so nothing
       is lost by drawing them separately. */
    for (const run of runs) {
      for (let i = 1; i < run.length; i++) {
        const a = run[i - 1], b = run[i];
        const holed = thin.set.has(a.year) || thin.set.has(b.year);
        out.push(`<path class="series${holed ? ' over-hole' : ''}" data-id="${p.id}"`
          + ` stroke="${p.colour}" d="M${at(a.year)} ${y(a[view.metric])}`
          + ` L${at(b.year)} ${y(b[view.metric])}"></path>`);
      }
    }
  }
  /* ⚠️ **The marker is the face**, ringed in the player's colour. A dot needs a
     legend and a face does not, and the whole point of a marker here was that a
     player who appears in one season only should still be *someone*. The ring
     stays because the line has to be traceable between faces, and because a
     photograph is not always there — no avatar falls back to a plain dot. */
  for (const p of shown) {
    for (const pt of p.pts) {
      const cx = at(pt.year), cy = y(pt[view.metric]);
      const hole = thin.set.has(pt.year) ? ' on-hole' : '';
      out.push(`<g class="pt${hole}" data-id="${p.id}" data-year="${pt.year}"`
        + ` transform="translate(${cx} ${cy})">`
        + (p.who.a
          ? `<image href="${p.who.a}" x="${-FACE}" y="${-FACE}"`
            + ` width="${FACE * 2}" height="${FACE * 2}"`
            + ' preserveAspectRatio="xMidYMid slice" clip-path="url(#face)"></image>'
          : `<circle r="${FACE - 1}" fill="${p.colour}"></circle>`)
        + `<circle class="ring" r="${FACE}" fill="none" stroke="${p.colour}"></circle>`
        + '</g>');
    }
  }
  /* A fatter invisible target, because a marker is a hard thing to hover. */
  for (const p of shown) {
    for (const pt of p.pts) {
      out.push(`<circle class="hit" data-id="${p.id}" data-year="${pt.year}"`
        + ` cx="${at(pt.year)}" cy="${y(pt[view.metric])}" r="13"></circle>`);
    }
  }

  svg.innerHTML = out.join('');
  return shown;
}

/* ---------- the rest of the page ---------- */

function renderLegend(model, shown) {
  const ids = new Set(shown.map(p => p.id));
  $('legend').innerHTML = model.people
    .filter(p => ids.has(p.id))
    .sort((a, b) => b.peak - a.peak)
    .map(p => `<span class="lg${ids.has(p.id) ? '' : ' off'}" data-id="${p.id}">`
      + `<i style="background:${p.colour}"></i>`
      + (p.who.a ? `<img src="${p.who.a}" alt="">` : '')
      + `${p.who.n}<span class="pk">${score(p.peak)}</span></span>`).join('');
}

function renderTables(model) {
  /* ⚠️ The **same rule the chart marks with**, not a second one. These two tables
     were left on the fixed "fewer than six" test when the chart moved to two
     thirds of the median, so they called 2020 short and 2022 and 2026 normal
     while the axis above them said otherwise. */
  const thin = thinYears(model.seasons);
  const mark = yr => (thin.set.has(yr) ? '<i class="ast">*</i>' : '');

  const rows = [];
  for (const p of model.people) {
    for (const pt of p.pts) rows.push({ p, pt });
  }
  rows.sort((a, b) => b.pt[view.metric] - a.pt[view.metric]);
  $('best').innerHTML = '<tr><th>Season</th><th>Player</th><th>Score</th><th>Titles</th></tr>'
    + rows.slice(0, 14).map(r =>
      `<tr class="${thin.set.has(r.pt.year) ? 'thin' : ''}">`
      + `<td class="n">${r.pt.year}${mark(r.pt.year)}</td>`
      + `<td>${r.p.who.n}</td>`
      + `<td class="n">${score(r.pt[view.metric])}</td>`
      + `<td class="n">${r.pt.n} of ${r.pt.of}</td></tr>`).join('');

  $('years').innerHTML = '<tr><th>Year</th><th>Titles</th><th>Made of</th><th>Winners</th></tr>'
    + model.seasons.map(s => {
      const by = {};
      for (const t of s.tiers) by[t.tier] = (by[t.tier] || 0) + 1;
      const made = Object.entries(by)
        .sort((a, b) => honourRung(a[0]) - honourRung(b[0]))
        .map(([t, n]) => `${n}×${TIER_NAME[t] || t}`).join(', ');
      return `<tr class="${thin.set.has(s.year) ? 'thin' : ''}">`
        + `<td class="n">${s.year}${mark(s.year)}</td><td class="n">${s.total}</td>`
        + `<td>${made || '—'}</td><td class="n">${s.by.size}</td></tr>`;
    }).join('');
}

function renderWeights() {
  const b = BASIS[view.basis];
  const line = ['OLY', 20, 22, 23, 24, 25]
    .map(t => `${TIER_NAME[t]} <code>${weightOf(t, view.basis).toFixed(3)}</code>`)
    .join(' · ');
  $('weightNote').innerHTML =
    `<b>A score of 100 is the whole season</b> — every title on the board, and `
    + `nobody else with one. <b>Titles</b> counts them and treats them all alike. `
    + `<b>Weighted</b> asks what they were worth, on a <b>${b.label.toLowerCase()}</b> `
    + `ladder: ${b.why}. Super 750 is the unit — ${line} — and the steps are the `
    + `golden ratio, the same one the photographs on the Winners board are sized `
    + `by (<code>honourRung</code>), so nothing here invents a second ranking.`;
}

function renderControls() {
  const seg = (id, opts, key) => {
    $(id).innerHTML = opts.map(([val, label, dis]) =>
      `<button type="button" class="opt${view[key] === val ? ' on' : ''}"`
      + `${dis ? ' disabled' : ''} data-val="${val}">${label}</button>`).join('');
    $(id).onclick = e => {
      const b = e.target.closest('button');
      if (!b || b.disabled) return;
      view[key] = b.dataset.val;
      only.clear();
      go();
    };
  };
  seg('kindSeg', [['MS', 'Men’s'], ['WS', 'Women’s']], 'kind');
  seg('metricSeg', [['share', 'Titles'], ['weighted', 'Weighted']], 'metric');
  /* Greyed out under *Titles*, where it changes nothing — a control that is
     live and inert is a question the reader has to answer twice. */
  const flat = view.metric === 'share';
  seg('basisSeg', Object.entries(BASIS).map(([k, v]) => [k, v.label, flat]), 'basis');
  $('basisLbl').style.opacity = flat ? '.4' : '';
  $('floor').value = String(view.floor);
  $('floorTxt').textContent = (view.floor
    ? `players who scored ${view.floor} or better in some year`
    : 'everybody')
    + (view.autoFloor ? ' · the most it can hide and still show every season’s best' : '');
}

/**
 * The highest bar that still shows **whoever led each season**.
 *
 * The slider is a clutter control and the interesting default is not "show
 * everyone" — forty-four careers is a scribble — but it must not hide the person
 * who actually dominated a year. Walked up in the slider's own steps, stopped
 * one short of the first season whose best player would drop off.
 *
 * ⚠⚠ This asked the wrong question until 5 Sep 2026: *"is anybody on screen in
 * every season"*, which is satisfied by any visible player who happened to win
 * something that year, however little. The women's default came out at 35 on a
 * rule that was meant to hold the leaders, and CHEN Yu Fei — who led 2019 with a
 * 30 and scored 33.3 in 2023 — was not drawn at all. The bar it settles on is now
 * the lowest season-leading score there is, which is the only number that can
 * honestly be called "the most it can hide".
 *
 * ⚠️ Covering the top **two** of each season was the other candidate and it
 * collapses: some season's runner-up is always somebody with a peak of 10, so
 * the floor falls to 10 and twenty-three lines come back. Measured, not guessed.
 */
function bestFloor(model) {
  const now = new Date().getUTCFullYear();
  const need = [];
  for (const s of model.seasons) {
    /* ⚠️ The season being played is left out. In January it is one tournament
       and one winner; by mid-year it can be eight tournaments and eight
       different winners, whose leader is on 12 and would drag the bar to the
       floor. A part-played season cannot say who led it, so it is not asked. */
    if (!s.total || s.year >= now) continue;
    let lead = null;
    for (const p of model.people) {
      const pt = p.pts.find(q => q.year === s.year);
      if (pt && (!lead || pt[view.metric] > lead.v)) lead = { v: pt[view.metric], peak: p.peak };
    }
    if (lead) need.push(lead.peak);
  }
  if (!need.length) return 0;
  /* ⚠️ The leader's **peak**, not their score that season — the slider filters on
     a career's best year, so what has to clear the bar is the number the filter
     will actually read. Asking the wrong one of those two put the women's
     default at 35 instead of 20. */
  const lowest = Math.min(...need) * 100;
  let out = 0;
  for (let f = 0; f <= 60; f += 5) { if (f <= lowest + 1e-9) out = f; else break; }
  return out;
}

/* ---------- wiring ---------- */

let current = null;

function go() {
  renderWeights();
  let model = current = build();
  /* The default is derived from the data, so it moves with the draw and the
     metric — and stops moving the moment the reader touches the slider. */
  if (view.autoFloor) {
    const want = bestFloor(model);
    if (want !== view.floor) { view.floor = want; model = current = build(); }
  }
  renderControls();
  const shown = draw(model);
  renderLegend(model, shown);
  renderTables(model);

  const file = files[view.kind];
  const n = model.seasons.reduce((a, s) => a + s.total, 0);
  $('sub').innerHTML =
    `<b>${model.years[0]}–${model.years[model.years.length - 1]}</b> · `
    + `${n} titles · ${model.people.length} different winners · `
    + `harvested ${file.generated}. `
    + '<span class="warnline">* marks a season with a hole in it — far fewer '
    + 'titles than the ones around it, so a score built on one is built on less. '
    + '<b>2020</b> stopped in March. <b>2022</b> ran eight of these against a '
    + 'normal twelve to fifteen, with not one tournament held in China and the '
    + 'Finals moved out of Guangzhou. The last year is <b>ongoing</b>. The number '
    + 'under each year is how many titles there were to win, and a dashed leg is '
    + 'a line crossing one of the marked years.</span>';
}

$('floor').oninput = e => {
  view.floor = Number(e.target.value);
  view.autoFloor = false;
  only.clear();
  go();
};

$('legend').onclick = e => {
  const lg = e.target.closest('.lg');
  if (!lg) return;
  const id = Number(lg.dataset.id);
  if (only.has(id)) only.delete(id); else only.add(id);
  go();
};

/* Hovering a marker names the player and lists what they actually won, because
   the whole question this sketch is asking is whether a percentage is a fair
   summary of a season — and you cannot tell without seeing the titles. */
const tip = $('tip');
$('chart').addEventListener('mousemove', e => {
  const hit = e.target.closest('circle.hit, circle.pt');
  if (!hit || !current) { tip.hidden = true; unhighlight(); return; }
  const id = Number(hit.dataset.id);
  const year = Number(hit.dataset.year);
  const p = current.people.find(q => q.id === id);
  const pt = p && p.pts.find(q => q.year === year);
  if (!pt) { tip.hidden = true; return; }
  const s = current.seasons.find(q => q.year === year);
  tip.innerHTML =
    `<div class="who">${p.who.a ? `<img src="${p.who.a}" alt="">` : ''}`
    + `<span>${p.who.n}</span></div>`
    + `<div><span class="big">${score(pt[view.metric])}</span>`
    + `<span class="k"> / 100 in ${year}</span></div>`
    + `<div class="k">${pt.n} of ${pt.of} titles`
    + (view.metric === 'weighted'
      ? ` · ${(pt.weighted * s.mass).toFixed(2)} of ${s.mass.toFixed(2)} by weight` : '')
    + `</div><ul>${pt.titles
      .sort((a, b) => honourRung(a.tier) - honourRung(b.tier))
      .map(t => `<li>${t.name.trim()} <span class="k">${TIER_NAME[t.tier] || t.tier}</span></li>`)
      .join('')}</ul>`;
  tip.hidden = false;
  const box = $('chart').getBoundingClientRect();
  const left = e.clientX - box.left + 16;
  tip.style.left = Math.min(left, box.width - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.max(4, e.clientY - box.top - 20) + 'px';
  highlight(id);
});
$('chart').addEventListener('mouseleave', () => { tip.hidden = true; unhighlight(); });

function highlight(id) {
  for (const el of $('chart').querySelectorAll('path.series, .pt')) {
    el.classList.toggle('dim', Number(el.dataset.id) !== id);
  }
}
function unhighlight() {
  for (const el of $('chart').querySelectorAll('.dim')) el.classList.remove('dim');
}

try {
  await load('MS');
  go();
  /* The other draw in the background, so the toggle is instant when it is used
     and the page is not held up by it when it is not. */
  load('WS').then(renderControls);
} catch (err) {
  $('sub').innerHTML = `<span class="warnline">${err.message}</span> — this tool fetches `
    + `<code>../data/*.json</code>, so it needs the dev server: <code>node serve.mjs</code>, `
    + `then open <code>http://localhost:8090/tools/share.html</code>.`;
}
</script>
</body>
</html>
