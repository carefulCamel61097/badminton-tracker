<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badminton seasons</title>
<!-- An empty data URI, so the browser stops asking for a favicon that does not
     exist yet and the console stays clean enough for a suite to assert on. -->
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Badminton seasons</h1>

<form id="pick" class="controls" autocomplete="off" role="search">
  <span class="ctl search">
    <input type="search" id="q" placeholder="Search a player by name…"
           aria-label="search for a player" role="combobox"
           aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
    <ul id="suggest" class="suggest" role="listbox" aria-label="player suggestions" hidden></ul>
  </span>

  <span class="ctl menu">
    <button type="button" id="topBtn" class="seg" aria-expanded="false" aria-controls="topPanel">
      Top ranked <span class="caret">▾</span>
    </button>
    <div id="topPanel" class="panel" hidden>
      <div id="topTabs" class="tabs" role="tablist"></div>
      <ol id="topList" class="toplist"></ol>
    </div>
  </span>
</form>

<!-- Who you are looking at, said properly: photograph, flag, name. -->
<section id="hero" class="hero" hidden>
  <img id="heroAvatar" class="avatar" alt="" hidden>
  <div class="ident">
    <h2 id="heroName" class="who"></h2>
    <p class="meta">
      <img id="heroFlag" class="flag" alt="" hidden>
      <span id="heroMeta"></span>
    </p>
  </div>
  <div class="heroctl">
    <span id="kindWrap" role="group" aria-label="discipline"></span>
    <label class="toggle"><input type="checkbox" id="sized" checked> Size by weight</label>
  </div>
</section>

<div class="chiprow"><span class="lbl">Seasons</span>
  <div id="years" class="chips" role="group" aria-label="seasons"></div>
</div>

<div class="chiprow"><span class="lbl">Levels</span>
  <div class="chips" role="group" aria-label="tournament levels">
    <span id="levels" class="chips"></span>
    <span class="menu">
      <button type="button" id="moreBtn" class="chip more" aria-expanded="false"
              aria-controls="morePanel" hidden></button>
      <div id="morePanel" class="panel checks" hidden></div>
    </span>
  </div>
</div>

<p id="status" role="status"></p>

<div id="seasons" class="seasons"></div>
<p id="empty" class="empty" hidden></p>

<footer class="foot">
  <p>
    <strong>Unofficial · data from BWF.</strong>
    All data, photographs and flags come from
    <a href="https://bwfbadminton.com/" target="_blank" rel="noopener">BWF</a>
    and belong to them. This is a fan tool, not affiliated with or endorsed by BWF.
    Each square links back to that tournament's page on their site.
  </p>
  <details id="rawWrap">
    <summary>The seasons as data</summary>
    <pre id="raw"></pre>
  </details>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
